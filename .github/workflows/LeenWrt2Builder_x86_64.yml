name: LeenWrt2Builder_x86_64
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      version: {description: '版本 (fanchmwrt 分支: 25.12.4 / 25.12.2)', required: true, type: string, default: '25.12.4'}
      profile: {description: '配置 (Main=主路由 / Mini=旁路由)', required: true, type: choice, options: [Main, Mini], default: 'Main'}
      adguardhome: {description: '启用 AdGuardHome 广告过滤', required:  false, type: boolean, default: true}
      openclash: {description: '启用 OpenClash 代理', required: false, type: boolean, default: true}
      dns_hijack: {description: '强制局域网 DNS 走 AdGuardHome（关则停用去广告并回退普通 DNS；ADGH 未运行时会自动回退，不会断网）', required: false, type: boolean, default: true}
      custom_ip: {description: '自定义IP', type: string, default: ''}
      custom_gateway: {description: '网关(旁路由)', type: string, default: ''}
      bypass_ip: {description: '旁路由IP(主路由双路由填写，留空=单路由全量劫持)', type: string, default: ''}
      pppoe_username: {description: 'PPPoE账号(主路由)', type: string, default: ''}
      pppoe_password: {description: 'PPPoE密码(主路由)', type: string, default: ''}
      root_password: {description: 'root密码', type: string, default: ''}
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: .

      - name: 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 拉取源码
        run: |
          set -e
          source $GITHUB_WORKSPACE/cores/fanchmwrt.conf
          SRC_REF="fanchmwrt-${{ github.event.inputs.version }}"
          rm -rf openwrt
          # fwx 内核栈仅在 fanchmwrt 分支，按分支浅克隆
          timeout 180 git clone --depth 1 --single-branch --branch "$SRC_REF" "$REPO_URL" openwrt

      - name: 配置与编译
        id: build
        run: |
          set -e
          source $GITHUB_WORKSPACE/cores/fanchmwrt.conf
          FEEDS_FILE_ABS="$GITHUB_WORKSPACE/$FEEDS_FILE"
          FILES_DIR_ABS="$GITHUB_WORKSPACE/$FILES_DIR"
          # 清除 Windows 提交引入的 CRLF（路由器 ash 不兼容）
          find $GITHUB_WORKSPACE -type f \( -name "*.sh" -o -name "*.yaml" -o -path "*/init.d/*" \) \
            -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          cd openwrt
          case "${{ github.event.inputs.profile }}" in
            Main) CFG_PREFIX=default; RUN_TYPE=main;;
            Mini) CFG_PREFIX=mini;    RUN_TYPE=bypass;;
            *) echo "未知 profile: ${{ github.event.inputs.profile }}"; exit 1;;
          esac
          MAIN_VER="${{ github.event.inputs.version }}"; MAIN_VER="${MAIN_VER%.*}"

          chmod +x $GITHUB_WORKSPACE/scripts/diy.sh $GITHUB_WORKSPACE/scripts/upgrade-adgh-binary.sh $GITHUB_WORKSPACE/scripts/upgrade-openclash.sh
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p before -t $RUN_TYPE --core fanchmwrt --feeds "$FEEDS_FILE_ABS"
          ./scripts/feeds update -a

          # 主题标题改写/footer 隐藏（feeds update 后）：标题改 LuCI Lua 表达式（修 {{hostname}} 不渲染）；footer 保留 DOM 仅隐藏（修 argon 删 footer 致侧边栏消失）
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p themes -t $RUN_TYPE --core fanchmwrt

          # ruby YJIT 解耦（openclash=true 时）：feeds update 后、install 前
          if [ "${{ github.event.inputs.openclash }}" = "true" ]; then
            $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p ruby -t $RUN_TYPE --core fanchmwrt
          fi

          # OpenClash LuCI 替换官方仓库（openclash=true 时）：feeds update 后、install 前
          if [ "${{ github.event.inputs.openclash }}" = "true" ]; then
            $GITHUB_WORKSPACE/scripts/upgrade-openclash.sh luci "$GITHUB_WORKSPACE/openwrt"
          fi

          # AdGuardHome：去除 luci-app 对引擎包(adguardhome)硬依赖，引擎走二进制注入（25.12）
          if [ "${MAIN_VER}" = "25.12" ]; then
            ADGH_LUCI_MK="feeds/luci/applications/luci-app-adguardhome/Makefile"
            if [ -f "$ADGH_LUCI_MK" ]; then
              sed -i -e 's/+adguardhome //g' -e '/LUCI_EXTRA_DEPENDS:=adguardhome/d' "$ADGH_LUCI_MK"
              echo "[build] 已去除 luci-app-adguardhome 对 adguardhome 引擎的硬依赖"
            else
              echo "[build] 警告: 未找到 luci-app-adguardhome Makefile，跳过依赖去除"
            fi
          fi

          ./scripts/feeds install -a -f

          # 写入最小 .config（configs/fanchmwrt-lean.config），defconfig 展开
          cp $GITHUB_WORKSPACE/configs/fanchmwrt-lean.config .config
          sed -i 's/\r$//' .config
          # ADGH/OC 选装包：勾选时注入 CONFIG_PACKAGE_*（清单单一来源：configs/{adgh,oc}-packages.list）
          # 引擎不编译：AdGuardHome 走 upgrade-adgh-binary.sh 注入二进制；OpenClash 核心走 upgrade-openclash.sh core 预装
          _inject_pkg_list() {
            local _list="$1" _label="$2"
            [ -f "$_list" ] || return 0
            {
              echo ""
              echo "# ===== $_label ====="
              while read -r _pkg; do
                case "$_pkg" in
                  ''|\#*) continue ;;
                esac
                echo "CONFIG_PACKAGE_${_pkg}=y"
              done < "$_list"
            } >> .config
            echo "[build] 已追加 $_label（来自 $_list）"
          }
          [ "${{ github.event.inputs.openclash }}" = "true" ] && _inject_pkg_list "$GITHUB_WORKSPACE/configs/oc-packages.list" "OpenClash 选装包"
          [ "${{ github.event.inputs.adguardhome }}" = "true" ] && _inject_pkg_list "$GITHUB_WORKSPACE/configs/adgh-packages.list" "AdGuardHome 选装包"
          echo "[build] FanchmWrt: 已写入最小 .config + ADGH/OC 选装包，make defconfig 将展开"

          # 用定制 feature.cfg 覆盖 fwxd 应用特征库
          FWXD_CFG="package/fcm/fwxd/files/feature.cfg"
          if [ -f "$GITHUB_WORKSPACE/appfilter-assets/feature.cfg" ] && [ -f "$FWXD_CFG" ]; then
            cp -f "$GITHUB_WORKSPACE/appfilter-assets/feature.cfg" "$FWXD_CFG"
            echo "[build] FanchmWrt: 已覆盖 fwxd 应用特征库 (-> /etc/fwxd/feature.cfg)"
          elif [ -f "$GITHUB_WORKSPACE/appfilter-assets/feature.cfg" ]; then
            echo "[build] 警告: 未找到 fwxd feature.cfg，跳过覆盖"
          fi

          ROOTPWD="${{ github.event.inputs.root_password }}"; ROOTPWD="${ROOTPWD:-password}"
          CIP="${{ github.event.inputs.custom_ip }}"; CGW="${{ github.event.inputs.custom_gateway }}"
          BIP="${{ github.event.inputs.bypass_ip }}"
          PUSER="${{ github.event.inputs.pppoe_username }}"; PPASS="${{ github.event.inputs.pppoe_password }}"
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p after -t $RUN_TYPE --core fanchmwrt --files-dir "$FILES_DIR_ABS" \
            ${CIP:+--ip "$CIP"} ${CGW:+--gateway "$CGW"} ${BIP:+--bypass-ip "$BIP"} \
            ${PUSER:+--pppoe-user "$PUSER"} ${PPASS:+--pppoe-pass "$PPASS"} \
            --root-pass "$ROOTPWD"

          # OpenClash Meta 核心预装 + AdGuardHome 二进制注入（按勾选，注入 FILES_DIR_ABS 后随 files 复制进镜像）
          if [ "${{ github.event.inputs.openclash }}" = "true" ]; then
            $GITHUB_WORKSPACE/scripts/upgrade-openclash.sh core "$GITHUB_WORKSPACE" --files-dir "$FILES_DIR_ABS"
          fi
          if [ "${{ github.event.inputs.adguardhome }}" = "true" ]; then
            $GITHUB_WORKSPACE/scripts/upgrade-adgh-binary.sh "$GITHUB_WORKSPACE" --files-dir "$FILES_DIR_ABS"
          fi

          [[ -d "$FILES_DIR_ABS" ]] && { rm -rf files; cp -rf "$FILES_DIR_ABS" files; } || true
          # 共享静态文件层（如 cpufreq-perf）覆盖到核专属 files 之上
          [[ -d "$GITHUB_WORKSPACE/files/common" ]] && { cp -rf "$GITHUB_WORKSPACE/files/common/." files/; } || true

          # 文件清理：按勾选删除不需要的静态文件（在 openwrt/files 副本上操作）
          if [ "${{ github.event.inputs.profile }}" = "Mini" ]; then
            :  # 新拓扑：旁路由保留 dns-hijack（与主路由同走重定向）
          elif [ "${{ github.event.inputs.profile }}" = "Main" ]; then
            if [ "${{ github.event.inputs.adguardhome }}" = "false" ]; then
              rm -rf files/etc/adguardhome
              rm -f files/usr/bin/AdGuardHome
              rm -f files/etc/init.d/adguardhome
              rm -f files/etc/config/adguardhome
              rm -f files/etc/hotplug.d/iface/99-adgh-filters
            fi
            if [ "${{ github.event.inputs.adguardhome }}" = "false" ] || [ "${{ github.event.inputs.dns_hijack }}" = "false" ]; then
              rm -f files/usr/sbin/dns-hijack
            fi
            if [ "${{ github.event.inputs.openclash }}" = "false" ]; then
              rm -rf files/etc/openclash
            fi
          fi

          # 离线 .apk + 在线 lists：拷入首启安装目录
          mkdir -p files/etc/firstboot-pkgs/apps
          cp -f $GITHUB_WORKSPACE/apps/*.apk files/etc/firstboot-pkgs/apps/ 2>/dev/null || true
          mkdir -p files/etc/firstboot-pkgs/lists
          # common/default 始终拷（在线装其余包）；ADGH/OC 已编译进固件，不再经 lists 安装
          cp -f $GITHUB_WORKSPACE/lists/common.txt files/etc/firstboot-pkgs/lists/ 2>/dev/null || true
          cp -f $GITHUB_WORKSPACE/lists/default.txt files/etc/firstboot-pkgs/lists/ 2>/dev/null || true
          # DNS 劫持：1=重定向 :53，0=REJECT 出向（firstboot-pkgs 读取）
          if [ "${{ github.event.inputs.dns_hijack }}" = "true" ]; then
            echo "1" > files/etc/firstboot-pkgs/dns_hijack 2>/dev/null || true
          else
            echo "0" > files/etc/firstboot-pkgs/dns_hijack 2>/dev/null || true
          fi
          find files/ -type f \( -path "*/sbin/*" -o -path "*/init.d/*" -o -path "*/hotplug.d/*" -o -path "*/uci-defaults/*" -o -name "*.sh" \) -exec chmod 755 {} + 2>/dev/null || true
          make defconfig && make download && make clean
          make -j$(nproc) || make -j1 V=s
          TS=$(date +%Y%m%d%H%M%S)
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          shopt -s nullglob; for f in bin/targets/x86/64/*combined.img.gz; do mv "$f" "${f%.img.gz}-$TS.img.gz"; done; shopt -u nullglob

      - name: 上传固件
        uses: softprops/action-gh-release@v2
        with:
          name: leenwrt2 ${{ github.event.inputs.version }} (${{ github.event.inputs.profile }})
          tag_name: leenwrt2-${{ github.event.inputs.version }}-${{ github.event.inputs.profile }}
          files: openwrt/bin/targets/x86/64/*-${{ steps.build.outputs.timestamp }}.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
