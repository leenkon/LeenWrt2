# FanchmWrt（OpenWrt fork，原生 fwx 应用过滤）核心描述
# 轻量原生编译：workflow 内联最小 target + kmod + apk，make defconfig 展开；IP/WAN/主机名由 diy.sh after 写入 99-custom.sh，其余包经 apps/(离线.apk)/lists/(官方源) 首启安装。
# 取源：fwx 内核栈(kmod-fwx/fwxd) 仅主仓库【分支】fanchmwrt-25.12.4/25.12.2 有（所有 v25.12.x tag 均不含）→ 走分支 fanchmwrt-${VERSION}（不可钉 tag 复现）；版本选项见 workflow 输入。
# feeds/fanchmwrt-25.12.conf 已钉官方源 + fanchmwrt-packages(不钉)；luci + fwx 全家桶于 workflow 内联 .config 编入镜像。
REPO_URL="https://github.com/fanchmwrt/fanchmwrt"
FEEDS_FILE="feeds/fanchmwrt-25.12.conf"
FILES_DIR="files/fanchmwrt"
